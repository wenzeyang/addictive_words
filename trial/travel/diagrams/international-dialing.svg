<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img"><title>国际号码的组成</title><desc>用虚构号码讲解结构；国际拨号前缀随出发地区、设备及服务商而异，手机通常可保存加号国际格式。</desc><rect width="2400" height="1350" fill="#F7FAFC"/><text x="80" y="100" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="54" font-weight="650" fill="#142B3B">国际号码的组成</text><text x="80" y="155" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#5B6B75">Language study specimen · SAMPLE · Fictional details</text><rect x="80.0" y="215.0" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="120.0" cy="257.0" r="25" fill="#F4B400"/><text x="113.0" y="266.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">1</text><text x="165.0" y="262.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">international access prefix</text><text x="165.0" y="315.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">国际拨号前缀</text><text x="165.0" y="360.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">Example prefix varies</text><rect x="1200.0" y="215.0" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="1240.0" cy="257.0" r="25" fill="#F4B400"/><text x="1233.0" y="266.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">2</text><text x="1285.0" y="262.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">country calling code</text><text x="1285.0" y="315.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">国家呼叫代码</text><text x="1285.0" y="360.0" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">+00 (fictional)</text><rect x="80.0" y="561.6666666666667" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="120.0" cy="603.6666666666667" r="25" fill="#F4B400"/><text x="113.0" y="612.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">3</text><text x="165.0" y="608.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">area code</text><text x="165.0" y="661.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">区号</text><text x="165.0" y="706.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">000 (fictional)</text><rect x="1200.0" y="561.6666666666667" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="1240.0" cy="603.6666666666667" r="25" fill="#F4B400"/><text x="1233.0" y="612.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">4</text><text x="1285.0" y="608.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">local phone number</text><text x="1285.0" y="661.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">本地电话号码</text><text x="1285.0" y="706.6666666666667" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">0000 0000 (fictional)</text><rect x="80.0" y="908.3333333333334" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="120.0" cy="950.3333333333334" r="25" fill="#F4B400"/><text x="113.0" y="959.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">5</text><text x="165.0" y="955.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">international format</text><text x="165.0" y="1008.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">国际格式</text><text x="165.0" y="1053.3333333333335" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">+00 000 0000 0000</text><rect x="1200.0" y="908.3333333333334" width="1096.0" height="328.6666666666667" rx="10" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="1240.0" cy="950.3333333333334" r="25" fill="#F4B400"/><text x="1233.0" y="959.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">6</text><text x="1285.0" y="955.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#142B3B">extension</text><text x="1285.0" y="1008.3333333333334" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#142B3B">分机号</text><text x="1285.0" y="1053.3333333333335" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#5B6B75">Extension 000</text><text x="85" y="1322" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#5B6B75">SAMPLE — vocabulary practice only; not a valid travel document or live service</text></svg>