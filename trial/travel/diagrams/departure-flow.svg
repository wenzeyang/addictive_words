<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img"><title>出境与登机流程</title><desc>通用学习流程；实际步骤及顺序以机场、航线和工作人员指示为准。</desc><rect width="2400" height="1350" fill="#F7FAFC"/><text x="80" y="100" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="54" font-weight="650" fill="#142B3B">出境与登机流程</text><text x="80" y="155" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#5B6B75">Language study specimen · SAMPLE · Fictional details</text><rect x="90" y="250" width="700" height="350" rx="14" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="142" cy="305" r="25" fill="#F4B400"/><text x="135" y="314" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">1</text><text x="135" y="385" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="600" fill="#142B3B">check in</text><text x="135" y="455" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#142B3B">值机</text><text x="135" y="530" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5B6B75">Confirm booking</text><rect x="860" y="250" width="700" height="350" rx="14" fill="white" stroke="#B7CEDD" stroke-width="2"/><circle cx="912" cy="305" r="25" fill="#F4B400"/><text x="905" y="314" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#142B3B">2</text><text x="905" y="385" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="600" fill="#142B3B">bag drop</text><text x="905" y="455" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#142B3B">行李托运</text><text x="905" y="530" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5B6B75">Check baggage</text><rect x="1630" y="250" width="700" height="350" rx="14" fill="white" stroke="#B7CEDD" stroke-width="2"