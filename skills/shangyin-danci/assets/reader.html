<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#273730;font:16px/1.9 system-ui,"Microsoft YaHei",sans-serif}header,main,.tools{max-width:1140px;margin:auto;padding:24px}h1{font-family:Georgia,"SimSun",serif;font-size:34px;margin:8px 0}header p{color:#63736b;margin:4px 0}nav{position:sticky;top:0;background:#f7f6f0f5;border-block:1px solid #dae2d7;z-index:2}.tools{padding-block:12px;display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:1px solid #bfcfc4;border-radius:5px;background:white;color:#305e49;padding:6px 12px}button.active{background:#305e49;color:white}button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #d29732;outline-offset:3px}input[type=search]{border:1px solid #bfcfc4;border-radius:5px;padding:6px 10px;min-width:200px;max-width:100%}.notice{padding:10px 16px;background:#eaf0e6;border-left:3px solid #8ea48e;color:#52684f;margin-bottom:16px;font-size:14px}.para{border-bottom:1px solid #dae2d7;padding:20px 0}.pid,.small{font-size:12px;color:#748277}.prose{font-size:18px;line-height:2;white-space:pre-line;overflow-wrap:anywhere}.en{font-family:Georgia,"Times New Roman",serif;line-height:1.85}.pair{display:grid;grid-template-columns:1fr 1fr;gap:30px}.unit{font:inherit;line-height:inherit;padding:0 2px;border:0;border-radius:2px;background:#e0eddf;display:inline;color:#215b41;box-decoration-break:clone}.unit .en{font-size:1.03em}.meaning{font-size:.88em;color:#6d7d70}.hide .meaning{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{border:1px solid #dae2d7;border-radius:8px;padding:20px;background:white;overflow-wrap:anywhere}.card h3{font:600 22px/1.45 Georgia,serif;margin:8px 0}.card p{margin:8px 0}.tag{display:inline-block;font-size:12px;background:#edf3e8;border-radius:3px;padding:0 6px;margin:2px}.row{border-bottom:1px solid #dae2d7;padding:16px 0}dialog{width:min(800px,94vw);max-height:85vh;border:1px solid #bfcfc4;border-radius:10px;padding:24px;background:#f7f6f0;color:#273730}dialog::backdrop{background:#16312466}.close{float:right}mark{background:#d5e7b8;color:inherit}details{margin-top:14px}summary{cursor:pointer}footer{text-align:center;padding:20px;color:#748277;font-size:12px}@media(max-width:700px){.pair{grid-template-columns:1fr;gap:16px}.pair .en{border-left:2px solid #dae2d7;padding-left:12px}header,main,.tools{padding-inline:16px}.prose{font-size:17px}h1{font-size:28px}}@media print{nav,.notice,dialog{display:none}body{background:white}.unit{background:none}main{max-width:none}.para,.card{break-inside:avoid}}
</style></head><body><header><div class="small">上瘾单词 · 小说阅读与词汇学习</div><h1>__TITLE__</h1><p id="stats"></p></header>
<nav><div class="tools" id="tabs"><button data-mode="reading">回填阅读</button><button data-mode="parallel">中英对照</button><button data-mode="zh">中文</button><button data-mode="en">English</button><button data-mode="cards">学习卡</button><button data-mode="notes">术语与审校</button></div><div class="tools"><label><input id="show" type="checkbox" checked> 显示中文提示</label><input id="search" type="search" aria-label="查找内容" placeholder="查找中文、英文或段落编号"></div></nav>
<main><div class="notice" id="notice"></div><div id="content"></div></main><dialog id="dialog" aria-labelledby="detail-title"><button class="close" id="close">关闭 ×</button><div id="detail"></div></dialog><footer>离线文件 · 词库标签表示目标词头命中；英文搭配和混合文本请结合完整译句学习</footer>
<script type="application/json" id="data">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=Object.fromEntries(D.cards.map(c=>[c.id,c]));let mode=D.stats.mode==='bilingual'?'parallel':'reading';
if(D.stats.mode==='bilingual')document.querySelector('[data-mode="reading"]').hidden=true;
$('stats').textContent=`${D.stats.paragraphs} 段 · ${D.stats.cards} 张学习卡 · ${D.stats.replacements} 处回填${D.stats.density_target!=null?' · 动态目标约 '+D.stats.density_target+' 处':''} · 每句最多 ${D.stats.max_per_sentence} 处${D.stats.status==='partial'?' · 阶段预览，尚未完成':''}`;
function targetTags(c){return c.targets.map(t=>`<span class="tag">${E(t.lemma)} → ${E(t.surface)} · ${E(t.lexicons.join(' / '))}</span>`).join('')}
function showCard(c){return `<article class="card"><div class="small">${E(c.paragraph_id)} · ${E(c.type)}</div><h3>${E(c.en)}</h3>${targetTags(c)}<p>${E(c.zh)}</p><p><strong>语境义：</strong>${E(c.meaning)}</p><p class="en">${E(c.pattern)}</p><p>${E(c.note)}</p><div class="small">${c.selected?'已回填':'仅学习卡：'+E(c.selection_reason)}</div><details><summary>完整上下文</summary><p class="en">${E(c.en_context)}</p><p>${E(c.zh_context)}</p></details></article>`}
function render(){let q=$('search').value.trim().toLowerCase(),match=s=>String(s).toLowerCase().includes(q),out='';document.body.classList.toggle('hide',!$('show').checked);
document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false')});
if(mode==='cards'){out='<div class="cards">'+D.cards.filter(c=>match([c.en,c.zh,c.paragraph_id,c.meaning,c.pattern,...c.targets.map(t=>t.lemma)].join(' '))).map(showCard).join('')+'</div>';$('notice').textContent='每张卡保留完整英文上下文；未回填项可能因句内限额、重叠或非连续对齐而保留。';}
else if(mode==='notes'){out='<h2>全局审校说明</h2><pre class="prose">'+E(JSON.stringify(D.review_notes,null,2))+'</pre><h2>术语</h2><pre class="prose">'+E(JSON.stringify(D.terminology,null,2))+'</pre><h2>段落问题</h2>'+D.paragraphs.filter(p=>p.issues?.length).map(p=>`<div class="row"><strong>${E(p.id)}</strong><div class="prose">${E(JSON.stringify(p.issues,null,2))}</div></div>`).join('')+'<h2>词库来源快照</h2><pre class="prose">'+E(JSON.stringify(D.lexicons,null,2))+'</pre>';$('notice').textContent='结构检查、模型对照审校与独立人工终审是不同环节。源文疑点以这里的记录为准。';}
else{out=D.paragraphs.filter(p=>match(p.id+' '+p.zh+' '+p.en)).map(p=>{let body;if(mode==='parallel')body=`<div class="pair"><div class="prose">${E(p.zh)||'【待译】'}</div><div class="prose en" lang="en">${E(p.en)||'[Pending translation]'}</div></div>`;else if(mode==='reading')body='<div class="prose">'+p.segments.map(s=>s.unit_id?`<button class="unit" data-unit="${E(s.unit_id)}"><span class="en" lang="en">${E(s.en)}</span><span class="meaning">（${E(s.zh)}）</span></button>`:E(s.text)).join('')+'</div>';else body=`<div class="prose ${mode==='en'?'en':''}" lang="${mode==='en'?'en':'zh-CN'}">${E(p[mode])||'【待译】'}</div>`;return `<section class="para"><div class="pid">${E(p.id)}${p.ready?'':' · 待译／待审校'}</div>${body}</section>`}).join('');$('notice').textContent=mode==='reading'?'每句计数，段落不设总上限。点击英文片段查看用法；完整英语语法以英文栏为准。':'中英两栏按同一源段编号对应，保留原始语言与另一语言译文。';}
$('content').innerHTML=out||'<p>没有匹配内容。</p>';}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render()}});$('show').addEventListener('change',render);$('search').addEventListener('input',render);
$('content').addEventListener('click',e=>{let b=e.target.closest('[data-unit]');if(!b)return;let c=cards[b.dataset.unit];let chars=Array.from(c.en_context);$('detail').innerHTML=`<h2 id="detail-title" class="en">${E(c.en)}</h2>${targetTags(c)}<p>${E(c.zh)} · ${E(c.meaning)}</p><p class="en">${E(c.pattern)}</p><p>${E(c.note)}</p><p class="prose en">${E(chars.slice(0,c.en_start).join(''))}<mark>${E(chars.slice(c.en_start,c.en_end).join(''))}</mark>${E(chars.slice(c.en_end).join(''))}</p>`;$('dialog').showModal()});$('close').addEventListener('click',()=>$('dialog').close());render();
</script></body></html>
